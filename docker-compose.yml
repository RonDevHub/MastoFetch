version: '3.8'

services:
  mastofetch:
    image: ghcr.io/rondevhub/mastofetch:latest
    container_name: mastofetch_app
    ports:
      - "8080:80"
    environment:
      # Mastodon API Access Tokens für die jeweiligen Instanzen
      # Format: MASTO_TOKEN_[INSTANZ_MIT_UNTERSTRICHEN]
      - MASTO_TOKEN_MASTODON_SOCIAL=dein_access_token_hier
      - MASTO_TOKEN_MASTODON_NET=dein_zweites_access_token_hier
      - DISABLE_DOCS=true  # 'true' sperrt die index.php, 'false' schaltet sie frei
    volumes:
      - ./storage:/var/www/html/storage
      - ./config:/var/www/html/config
      - ./.env:/var/www/html/.env
    restart: unless-stopped