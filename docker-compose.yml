version: '3.8'

services:
  mastofetch:
    image: ghcr.io/rondevhub/mastofetch:latest
    container_name: mastofetch_app
    ports:
      - "8080:80"
    volumes:
      - ./storage:/var/www/html/storage
      - ./config:/var/www/html/config
      - ./.env:/var/www/html/.env
    restart: unless-stopped