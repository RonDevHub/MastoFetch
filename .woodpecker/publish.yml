steps:
  # --- 1. Main-Branch (latest) ---
  publish-latest:
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: ghcr.io
      repo: rondevhub/mastofetch
      username:
        from_secret: ghcr_user
      password:
        from_secret: ghcr_token
      tags: latest
      dockerfile: Dockerfile
      context: .
      build_args:
        - BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        - VERSION=latest
        - VCS_REF=${CI_COMMIT_SHA}
    when:
      event: push
      branch: main

  # --- 2. Beta-Branch (beta) ---
  publish-beta:
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: ghcr.io
      repo: rondevhub/mastofetch
      username:
        from_secret: ghcr_user
      password:
        from_secret: ghcr_token
      tags: beta
      dockerfile: Dockerfile
      context: .
      build_args:
        - BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        - VERSION=beta
        - VCS_REF=${CI_COMMIT_SHA}
    when:
      event: manual
      branch: beta

  # --- 3. Release-Tags ---
  publish-tag:
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: ghcr.io
      repo: rondevhub/mastofetch
      username:
        from_secret: ghcr_user
      password:
        from_secret: ghcr_token
      tags: ${CI_COMMIT_TAG}
      dockerfile: Dockerfile
      context: .
      build_args:
        - BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        - VERSION=${CI_COMMIT_TAG}
        - VCS_REF=${CI_COMMIT_SHA}
    when:
      event: tag